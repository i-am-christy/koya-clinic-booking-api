<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1e293b; --muted: #64748b;
    --accent: #0f766e; --accent-dark: #115e59; --line: #e2e8f0;
    --danger: #b91c1c; --ok: #166534;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  main { max-width: 620px; margin: 0 auto; padding: 2.5rem 1rem; }
  h1 { margin: 0; font-size: 1.7rem; }
  .intro { margin: .25rem 0 1.5rem; color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 2px 10px rgba(0,0,0,.03);
  }
  h2 { font-size: 1rem; margin: 0 0 .75rem; }
  .day {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 1rem 0 .4rem;
  }
  .day:first-child { margin-top: 0; }
  .slot {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding: .7rem .8rem; border: 1px solid var(--line); border-radius: 10px; margin-bottom: .5rem;
  }
  .slot strong { display: block; font-weight: 600; }
  .slot span { color: var(--muted); font-size: .9rem; }
  button {
    font: inherit; font-weight: 500; padding: .55rem 1rem; border: none;
    border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: #e2e8f0; color: var(--text); }
  button.secondary:hover { background: #cbd5e1; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .75rem; }
  input, select {
    width: 100%; margin-top: .3rem; padding: .65rem .8rem; border: 1px solid var(--line);
    border-radius: 10px; font: inherit; color: var(--text); background: #fff;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,118,110,.15);
  }
  .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: .5rem; }
  .message { font-size: .9rem; min-height: 1.2em; margin: .5rem 0 0; }
  .error { color: var(--danger); }
  .notice {
    padding: .8rem 1rem; border-radius: 10px; margin-bottom: 1rem; display: none;
    background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
  }
  .done { text-align: center; }
  .done .big { font-size: 1.25rem; font-weight: 600; color: var(--ok); margin: .25rem 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Book an appointment</h1>
    <p class="intro">Pick a time that suits you. Your booking is confirmed straight away.</p>
  </header>

  <div id="notice" class="notice"></div>

  <section class="card">
    <label>Provider
      <select id="provider"><option value="">All providers</option></select>
    </label>
  </section>

  <section class="card" id="listCard">
    <h2>Open times</h2>
    <div id="slots"></div>
    <p id="emptyMsg" class="muted hidden"></p>
  </section>

  <section class="card hidden" id="formCard">
    <h2>Confirm your booking</h2>
    <p class="muted" id="formSlot"></p>
    <form id="bookingForm">
      <label>Full name
        <input id="name" autocomplete="name" required>
      </label>
      <label>Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <div class="actions">
        <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        <button type="submit" id="confirmBtn">Confirm booking</button>
      </div>
      <p class="message" id="formMessage"></p>
    </form>
  </section>

  <section class="card done hidden" id="doneCard"></section>
    <section class="card" id="myCard">
    <h2>Manage my bookings</h2>
    <label>Email
      <input id="lookupEmail" type="email" autocomplete="email">
    </label>
    <div class="actions" style="justify-content:flex-start">
      <button type="button" class="secondary" id="lookupBtn">Show my bookings</button>
    </div>
    <div id="myBookings" style="margin-top:.75rem"></div>
    <div class="actions" style="justify-content:center">
      <button type="button" class="secondary hidden" id="moreBtn">Load more</button>
    </div>
    <p class="message" id="myMessage"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

let slots = [];
let chosen = null;   // the slot the user is booking
let pending = null;  // { key, slot_id, name, email } for the current attempt

// Small helpers
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
const dayLabel = iso => new Date(iso).toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
const timeOnly = iso => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const fullTime = iso => new Date(iso).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function notice(text) {
  const n = $("notice");
  n.textContent = text;
  n.style.display = text ? "block" : "none";
}

function formMessage(text, isError = true) {
  const m = $("formMessage");
  m.textContent = text;
  m.className = "message " + (isError ? "error" : "");
}

// Calls the page's own server route. The server adds the API key.
async function api(path, options = {}) {
  const res = await fetch("/page-api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) }
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(body.error || "Something went wrong. Please try again.");
    err.status = res.status;
    err.retryAfter = res.headers.get("Retry-After");
    throw err;
  }
  return body;
}

// Turns server messages into something a patient can act on
function friendlyError(err) {
  if (err.status === 429) return `Too many attempts. Please wait ${err.retryAfter || 60} seconds and try again.`;
  if (err.status === 400 && /email/i.test(err.message)) return "Please enter a valid email address.";
  if (err.status === 400 && /name/i.test(err.message)) return "Please enter your name.";
  return err.message;
}

async function loadSlots() {
  try {
    const data = await api("/slots");
    slots = data.slots;
    fillProviders();
    renderSlots();
  } catch (err) {
    notice(friendlyError(err));
  }
}

function fillProviders() {
  const select = $("provider");
  const current = select.value;
  const names = [...new Set(slots.map(s => s.provider))].sort();
  select.innerHTML = "";
  select.append(new Option("All providers", ""));
  names.forEach(name => select.append(new Option(name, name)));
  select.value = names.includes(current) ? current : "";
}

function renderSlots() {
  const list = $("slots");
  list.innerHTML = "";
  const provider = $("provider").value;
  const open = slots.filter(s => s.available && (!provider || s.provider === provider));

  const empty = $("emptyMsg");
  empty.textContent = "No open times right now. Please check back later.";
  empty.classList.toggle("hidden", open.length > 0);

  let lastDay = "";
  open.forEach(slot => {
    const day = dayLabel(slot.start);
    if (day !== lastDay) {
      list.append(el("div", "day", day));
      lastDay = day;
    }
    const row = el("div", "slot");
    const info = el("div");
    info.append(el("strong", "", `${timeOnly(slot.start)} to ${timeOnly(slot.end)}`), el("span", "", slot.provider));
    const btn = el("button", "", "Book");
    btn.onclick = () => openForm(slot);
    row.append(info, btn);
    list.append(row);
  });
}

function openForm(slot) {
  chosen = slot;
  pending = null;
  $("bookingForm").reset();
  formMessage("", false);
  $("formSlot").textContent = `${fullTime(slot.start)} with ${slot.provider}`;
  $("doneCard").classList.add("hidden");
  $("formCard").classList.remove("hidden");
  $("name").focus();
  $("formCard").scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeForm() {
  chosen = null;
  pending = null;
  $("formCard").classList.add("hidden");
}

$("cancelBtn").onclick = closeForm;
$("provider").onchange = renderSlots;

$("bookingForm").onsubmit = async event => {
  event.preventDefault();
  const name = $("name").value.trim();
  const email = $("email").value.trim();
  if (!name || !email) return formMessage("Please enter your name and email.");

  // One key per attempt. Reuse it only when retrying the same booking after a network failure,
  // so a retry can't create a second booking.
  const same = pending && pending.slot_id === chosen.id && pending.name === name && pending.email === email;
  if (!same) pending = { key: crypto.randomUUID(), slot_id: chosen.id, name, email };

  const btn = $("confirmBtn");
  btn.disabled = true;
  formMessage("Booking...", false);

  try {
    const booking = await api("/bookings", {
      method: "POST",
      headers: { "Idempotency-Key": pending.key },
      body: JSON.stringify({ slot_id: chosen.id, name, email })
    });
    pending = null;
    showDone(booking);
    await loadSlots();
  } catch (err) {
    if (err instanceof TypeError) {
      // Network failure: keep the key, so pressing Confirm again retries the same booking
      formMessage("Connection problem. Press Confirm again to retry.");
    } else if (err.status === 409) {
      // Someone else took the slot first
      closeForm();
      notice("Sorry, that time was just taken. Please choose another.");
      await loadSlots();
    } else {
      pending = null;
      formMessage(friendlyError(err));
    }
    btn.disabled = false;
  } finally {
    if (!$("formCard").classList.contains("hidden")) btn.disabled = false;
  }
};

function showDone(booking) {
  const slot = chosen;
  closeForm();
  notice("");
  const card = $("doneCard");
  card.innerHTML = "";
  card.append(
    el("div", "big", "You're booked"),
    el("p", "", `${fullTime(slot.start)} with ${slot.provider}`),
    el("p", "muted", `Confirmation for ${booking.name}, sent to ${booking.email}`),
    el("p", "muted", `Reference: ${booking.id}`)
  );
  const again = el("button", "secondary", "Book another time");
  again.onclick = () => card.classList.add("hidden");
  card.append(again);
  card.classList.remove("hidden");
  card.scrollIntoView({ behavior: "smooth", block: "start" });
}
let myEmail = "";
let myCursor = null;

function myMessage(text, isError = true) {
  const m = $("myMessage");
  m.textContent = text;
  m.className = "message " + (isError ? "error" : "");
}

function renderMyBooking(b) {
  const row = el("div", "slot");
  const info = el("div");
  // The booking only stores slot_id, so look up the time from the slots we already loaded
  const slot = slots.find(s => s.id === b.slot_id);
  const when = slot ? `${fullTime(slot.start)} with ${slot.provider}` : `Slot ${b.slot_id}`;
  info.append(
    el("strong", "", b.status === "cancelled" ? "Cancelled" : "Confirmed"),
    el("span", "", when)
  );
  row.append(info);

  if (b.status === "confirmed") {
    const btn = el("button", "secondary", "Cancel");
    btn.onclick = () => cancelBooking(b, btn, row);
    row.append(btn);
  }
  $("myBookings").append(row);
}

async function lookupBookings(reset) {
  if (reset) {
    myEmail = $("lookupEmail").value.trim();
    if (!myEmail) return myMessage("Enter your email to see your bookings.");
    myCursor = null;
    $("myBookings").innerHTML = "";
  }

  myMessage("Loading...", false);
  try {
    const params = new URLSearchParams({ email: myEmail, limit: "5" });
    if (myCursor) params.set("cursor", myCursor);
    const data = await api("/bookings?" + params.toString());

    if (reset && data.bookings.length === 0) {
      myMessage("No bookings found for this email.", false);
    } else {
      myMessage("", false);
    }
    data.bookings.forEach(renderMyBooking);
    myCursor = data.next_cursor;
    $("moreBtn").classList.toggle("hidden", !myCursor);
  } catch (err) {
    myMessage(friendlyError(err));
  }
}

async function cancelBooking(b, btn, row) {
  if (!confirm("Cancel this appointment?")) return;
  btn.disabled = true;
  try {
    await api(`/bookings/${encodeURIComponent(b.id)}`, { method: "DELETE" });
    row.querySelector("strong").textContent = "Cancelled";
    btn.remove();
    myMessage("Appointment cancelled. That time is free for others now.", false);
    await loadSlots(); // refresh so the freed time reappears in the list
  } catch (err) {
    if (err.status === 409) {
      // Already cancelled, so show the real state
      row.querySelector("strong").textContent = "Cancelled";
      btn.remove();
    } else {
      btn.disabled = false;
      myMessage(friendlyError(err));
    }
  }
}

$("lookupBtn").onclick = () => lookupBookings(true);
$("moreBtn").onclick = () => lookupBookings(false);
$("lookupEmail").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); lookupBookings(true); }
});

loadSlots();
</script>
</body>
</html>
