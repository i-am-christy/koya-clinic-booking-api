<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koya Clinic Booking</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #0f766e;
    --accent-dark: #115e59;
    --danger: #b91c1c;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem 1rem;
    min-height: 100vh;
  }

  /* The main white card that holds everything */
  body > h1,
  body > input,
  body > button,
  body > ul,
  body > #result {
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 1.25rem;
    text-align: center;
  }

  input {
    width: 100%;
    padding: .7rem .9rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: .95rem;
    background: var(--card);
    margin-bottom: .75rem;
    transition: border-color .15s, box-shadow .15s;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, .15);
  }

  button {
    padding: .55rem 1.1rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }

  button:hover { background: var(--accent-dark); }
  button:active { transform: scale(.97); }

  /* Full-width main button */
  body > button { width: 100%; }

  ul {
    list-style: none;
    padding: 0;
    margin: 1.25rem auto 0;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .04);
  }

  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: .9rem 1.1rem;
    border-bottom: 1px solid var(--border);
  }

  li:last-child { border-bottom: none; }

  li span { font-size: .95rem; }

  li button { padding: .4rem .9rem; font-size: .85rem; }

  #result {
    margin-top: 1.25rem;
    padding: 1rem 1.1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    white-space: pre-wrap;
    font-size: .95rem;
    line-height: 1.5;
    min-height: 1rem;
  }

  #result:empty { display: none; }

  .error {
    color: var(--danger) !important;
    border-color: #fecaca !important;
    background: #fef2f2 !important;
  }
</style>
</head>
<body>
<h1>Book a slot</h1>

<input id="apiKey" type="password" placeholder="API key">
<button id="load">Load slots</button>

<ul id="slots"></ul>
<div id="result"></div>

<script>
const $ = id => document.getElementById(id);

function show(text, isError = false) {
  $("result").textContent = text;
  $("result").className = isError ? "error" : "";
}

async function api(path, options = {}) {
  const key = $("apiKey").value.trim();
  if (!key) throw new Error("Enter the API key first.");

  const res = await fetch(path, {
    ...options,
    headers: {
      "X-API-Key": key,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(`${res.status}: ${body.error || JSON.stringify(body)}`);
  return body;
}

async function loadSlots() {
  $("slots").innerHTML = "";
  show("Loading...");
  try {
    const data = await api("/slots");
    if (!data || !Array.isArray(data.slots)) throw new Error("Unexpected response from /slots");

    const open = data.slots.filter(s => s.available);
    if (!open.length) return show("No open slots.");

    open.forEach(slot => {
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.textContent = `${slot.provider} at ${slot.start}`;

      const btn = document.createElement("button");
      btn.textContent = "Book";
      btn.onclick = () => book(slot);

      li.append(label, btn);
      $("slots").appendChild(li);
    });
    show("");
  } catch (e) {
    show(e.message, true);
  }
}

async function book(slot) {
  const name = prompt("Patient name?");
  if (!name) return;
  const email = prompt("Patient email?");
  if (!email) return;

  try {
    const booking = await api("/bookings", {
      method: "POST",
      body: JSON.stringify({ slot_id: slot.id, name: name, email: email })
    });
    show(`Booked.\nid: ${booking.id}\nstatus: ${booking.status}`);
  } catch (e) {
    show(e.message, true);
  }
}

$("load").onclick = loadSlots;
</script>
</body>
</html>
